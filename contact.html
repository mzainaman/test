<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{background:#080808;color:#e0e0e0;font-family:'Cormorant Garamond',serif;line-height:1.7;overflow-x:hidden;}
    a{text-decoration:none;color:inherit;transition:opacity .3s;}
    a:hover{opacity:.7;}
    p{font-family:'Montserrat',sans-serif;font-weight:200;letter-spacing:.05em;color:#aaa;line-height:1.9;}
    ::selection{background:#333;color:#fff;}

    nav{position:fixed;top:0;left:0;width:100%;padding:1.5rem 2rem;z-index:100;
        display:flex;align-items:center;gap:1rem;
        background:linear-gradient(to bottom,rgba(8,8,8,.96) 0,rgba(8,8,8,0) 100%);}
    .back{font-family:'Montserrat',sans-serif;font-size:.65rem;letter-spacing:.25em;
          text-transform:uppercase;opacity:.5;}
    .back:hover{opacity:1;}
    .back::before{content:'← ';letter-spacing:0;}

    .hero{
      min-height:50vh;display:flex;flex-direction:column;
      justify-content:flex-end;padding:clamp(4rem,10vw,7rem) clamp(1.5rem,6vw,5rem) 3rem;
      border-bottom:1px solid #111;
    }
    .hero-label{font-family:'Montserrat',sans-serif;font-size:.6rem;letter-spacing:.35em;
                text-transform:uppercase;opacity:.35;margin-bottom:1rem;}
    .hero h1{font-size:clamp(2.8rem,10vw,6rem);font-weight:300;font-style:italic;line-height:1.1;}
    .hero-sub{font-family:'Montserrat',sans-serif;font-size:clamp(.7rem,2vw,.9rem);
              letter-spacing:.2em;text-transform:uppercase;margin-top:1.2rem;opacity:.45;}

    .content{padding:clamp(3rem,8vw,5rem) clamp(1.5rem,6vw,5rem);max-width:900px;}
    .content h2{font-size:clamp(1.4rem,4vw,2rem);font-weight:300;margin-bottom:1.5rem;
                padding-bottom:.6rem;border-bottom:1px solid #1e1e1e;letter-spacing:.04em;}
    .content p+p{margin-top:1.2rem;}
    .content .email-link{text-decoration:underline;text-underline-offset:3px;}
    .content .note{margin-top:2rem;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;opacity:.4;}

    footer{padding:2.5rem 2rem;text-align:center;border-top:1px solid #111;
           font-family:'Montserrat',sans-serif;font-size:.65rem;letter-spacing:.15em;color:#333;line-height:2;}

    @media(max-width:600px){nav{padding:1.2rem 1.2rem;}}
  </style>
</head>
<body>
  <nav><a class="back" href="index.html">Home</a></nav>

  <header class="hero">
    <div class="hero-label">Portfolio</div>
    <h1>Contact.</h1>
    <div class="hero-sub">Let's connect</div>
  </header>

  <section class="content">
    <h2>Get in touch</h2>
    <p>Reach out for collaborations, questions, or just to say hello.</p>
    <p>Email: <a href="mailto:hello@example.com" class="email-link">hello@example.com</a></p>
    <p class="note">More channels coming soon.</p>
  </section>

  <footer>Portfolio &mdash; <a href="index.html">Return to network</a></footer>
</body>
</html>
